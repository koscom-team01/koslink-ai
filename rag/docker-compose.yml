services:
  # EMBEDDING_PROVIDER=kure일 때만 쓰는 로컬 폴백 서버 (app/core/embeddings/kure.py가
  # 호출). 해커톤 기본값은 EMBEDDING_PROVIDER=openai라 평소엔 기동할 필요 없음.
  embedding-server:
    build: ./embedding_server
    ports:
      - "7997:7997"
    environment:
      # 팬리스 맥북에서 장시간 배치 임베딩 시 전체 코어(8개)를 다 쓰면 발열이 커서
      # 절반만 쓰도록 제한 (느려지지만 안전하게).
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    volumes:
      - embedding_model_cache:/app/.cache

  langflow:
    image: langflowai/langflow:latest
    ports:
      - "7860:7860"
    environment:
      # 로컬 개발 전용 기본 계정. 배포 시에는 반드시 별도 값으로 교체
      - LANGFLOW_SUPERUSER=admin
      - LANGFLOW_SUPERUSER_PASSWORD=admin1234
      - LANGFLOW_COMPONENTS_PATH=/app/custom_components
      # 기본 DB 경로(/app/.venv/.../site-packages/langflow/langflow.db)는 컨테이너 재생성 시
      # 초기화되는 경로라, 마운트된 볼륨(langflow_data) 안으로 명시적으로 재지정
      - LANGFLOW_DATABASE_URL=sqlite:////app/langflow/langflow.db
      # KURE-v1는 API 키를 검증하지 않음 -> 더미 값
      - OPENAI_API_KEY=sk-local-dummy
    volumes:
      - langflow_data:/app/langflow
      - ./langflow/components:/app/custom_components
      - ./langflow/flows:/app/flows
    depends_on:
      - embedding-server

volumes:
  embedding_model_cache:
  langflow_data:
