[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dart-client"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.4.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
]

[tool.setuptools]
packages = ["dart_client"]
